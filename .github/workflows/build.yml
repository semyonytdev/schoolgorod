name: Собрать мод
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: schoolgorod-1.21.11
          path: build/libs/schoolgorod-0.1.0.jar
          if-no-files-found: error
      - name: Ограничить публикацию релизов веткой main
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: school-${{ github.run_number }}
          name: schoolgorod (сборка ${{ github.run_number }})
          files: build/libs/schoolgorod-0.1.0.jar
