plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { }

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def generatedSchoolResources = layout.buildDirectory.dir("generated/schoolgorod")

tasks.register("generateSchoolStructure", Exec) {
	inputs.file("tools/generate_school_structure.py")
	outputs.files(
		generatedSchoolResources.map { it.file("data/schoolgorod/structures/school/building.nbt") },
		generatedSchoolResources.map { it.file("data/schoolgorod/structures/school/building_nuze.nbt") }
	)
	commandLine("python3", "tools/generate_school_structure.py")
}

sourceSets.main.resources.srcDir(generatedSchoolResources)
processResources {
	dependsOn(tasks.named("generateSchoolStructure"))
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
